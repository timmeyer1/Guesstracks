<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : sans lui, iOS Safari garde la zone de l'encoche/
    barre d'état et de l'indicateur home comme marge inaccessible pour la page,
    et surtout react-native-safe-area-context (utilisé par l'app en natif)
    renvoie des insets à zéro faute de env(safe-area-inset-*) exploitable.
    maximum-scale=1, user-scalable=no : sans ça, iOS Safari zoome automati-
    quement la page dès qu'un <TextInput> reçoit le focus (comportement natif
    de Safari, indépendant de la taille de police de nos champs, déjà à 16px)
    — et comme window.visualViewport change de taille pendant ce zoom, le
    script plus bas (setRealViewportHeight) recalculait une hauteur fausse le
    temps que le zoom retombe, laissant une bande blanche en bas le temps
    que ça se stabilise. En figeant le zoom, l'un et l'autre disparaissent. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9622E0" />
    <!-- Sans ça, en mode standalone avec le système en Dark Mode, WebKit applique
    son propre thème sombre aux contrôles natifs (champs de texte, curseur,
    sélection...) même si notre CSS reste en clair partout : le texte tapé peut
    alors devenir illisible (ex: texte clair sur fond clair) dans la barre de
    recherche. L'app est pensée pour un thème clair uniquement, on le fige. -->
    <meta name="color-scheme" content="light" />
    <!-- Permet le vrai mode plein écran (sans barre d'adresse ni barre d'outils
    Safari) une fois la page ajoutée à l'écran d'accueil ("Partager" ->
    "Sur l'écran d'accueil") : en simple onglet Safari, ces barres restent
    toujours visibles, aucune page web ne peut les masquer. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guesstracks" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* cf. la balise <meta name="color-scheme"> plus haut : la fige aussi côté
      CSS, au cas où le meta seul ne suffise pas en mode standalone */
      :root {
        color-scheme: light;
      }
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* couleur de fond neutre de l'app (cf. tailwind.config.js, "white" =
        #FAFAFA) : évite qu'un résidu de mise en page ne laisse voir le blanc
        par défaut du WKWebView */
        background-color: #FAFAFA;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      100%/100vh/100dvh sur html/body se sont tous révélés FAUX de quelques
      dizaines de pixels sur certains appareils en mode standalone iOS (bande
      blanche visible), et un correctif en pourcentage fixe (ex: 104%) qui
      corrigeait un iPhone Pro cassait complètement l'affichage sur iPhone
      mini (proportion différente vis-à-vis de son écran plus petit) — et
      créait à son tour des bandes en haut ET en bas hors du mode standalone.
      Plutôt que deviner un nombre par catégorie d'appareil, on mesure la
      VRAIE hauteur visible via window.visualViewport (le seul chiffre fiable
      quel que soit l'appareil, la taille d'écran, ou le mode d'affichage) et
      on l'applique nous-mêmes en pixels sur <html> : tout le reste
      (body, #root, puis toute la chaîne flex de l'app) en hérite via son
      simple height:100% ci-dessus, sans plus jamais avoir besoin d'un calcul
      approximatif nulle part.
    -->
    <!--
      react-native-safe-area-context (utilisé côté app pour l'encoche/île
      dynamique) mesure ses insets via une sonde CSS insérée dans le DOM avec
      son padding déjà à sa valeur finale (env(safe-area-inset-*)) : comme
      aucune transition ne se produit jamais après l'insertion, son détecteur
      "transitionend" ne se déclenche jamais, et la seule lecture de secours
      (synchrone, juste après l'insertion) arrive trop tôt pour que WebKit
      ait résolu env() — confirmé en conditions réelles en mode standalone
      iOS : insets.top restait bloqué à 0, contenu masqué sous l'encoche.
      On mesure donc nous-mêmes, avec un double requestAnimationFrame qui
      laisse au moins un cycle de rendu complet avant de lire la valeur.
    -->
    <script>
      (function () {
        // la plus grande valeur observée alors qu'aucun clavier ne peut être
        // ouvert : PAS figée une fois pour toutes (contrairement à une
        // précédente version qui bloquait tout au premier appel — celui-ci a
        // lieu de façon synchrone dans <head>, avant toute mise en page, et
        // peut rendre une valeur trop petite ou nulle qui restait alors
        // bloquée pour le reste de la session, même après redémarrage de
        // l'app). Se met à jour vers le haut si une mesure ultérieure plus
        // grande arrive (auto-correction), jamais vers le bas hors clavier.
        var maxObservedHeight = 0;
        // dernière hauteur réellement appliquée à <html> : sert de garde-fou
        // ci-dessous (cf. setRealViewportHeight)
        var lastAppliedHeight = 0;

        // le clavier ne peut être affiché que si un champ a le focus : sert à
        // savoir s'il faut faire confiance à visualViewport.height (clavier
        // potentiellement ouvert, hauteur réduite légitime) ou l'ignorer
        // (aucun clavier possible, donc la pleine hauteur s'impose).
        function isKeyboardLikelyOpen() {
          var active = document.activeElement;
          return !!(
            active &&
            (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)
          );
        }

        function setRealViewportHeight() {
          var measured = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          var keyboardOpen = isKeyboardLikelyOpen();

          // Bug iOS connu (confirmé en conditions réelles) : après la
          // fermeture du clavier, window.visualViewport.height ne revient pas
          // toujours à la vraie hauteur d'origine — il peut rester bloqué
          // plusieurs dizaines de pixels en dessous, sans jamais se corriger
          // tout seul (ni au scroll, ni au tap). Comme le clavier ne peut être
          // ouvert que si un champ a le focus, une mesure prise SANS focus
          // est forcément fiable : on ne la garde que si elle est PLUS
          // GRANDE que la référence actuelle (jamais plus petite), pour
          // qu'une mesure ponctuellement trop basse (ex: au tout premier
          // appel, avant mise en page complète) ne bloque jamais rien —
          // une mesure correcte plus tard la corrige automatiquement.
          if (!keyboardOpen && measured > maxObservedHeight) {
            maxObservedHeight = measured;
          }

          var h = keyboardOpen || !maxObservedHeight ? measured : maxObservedHeight;

          // ne réapplique la hauteur que si elle a RÉELLEMENT changé. Sans ce
          // garde-fou : le listener 'scroll' du visual viewport plus bas
          // (à l'origine pour le scroll-into-view automatique du champ
          // focalisé) se déclenche aussi, sur iOS, pendant le scroll d'une
          // liste interne (ex: SectionList) quand le clavier est ouvert —
          // measured vaut alors quasiment toujours la même chose d'un appel à
          // l'autre, mais réécrire documentElement.style.height à l'identique
          // force quand même un reflow de toute la page à chaque frame de
          // scroll, ce qui se voit comme un tremblement/retour en arrière
          // (constaté en pratique, cf. app/screens/manualTrackPicker.screen.tsx).
          if (h !== lastAppliedHeight) {
            document.documentElement.style.height = h + 'px';
            lastAppliedHeight = h;
          }

          // iOS Safari a son propre comportement "scroll le champ focalisé
          // dans la vue" quand un <input>/<TextInput> reçoit le focus : ça
          // décale toute la page (document/body), MÊME avec overflow:hidden
          // sur body (bug connu de longue date sur iOS). On neutralise ce
          // scroll à l'ouverture ET à la fermeture du clavier — mais
          // uniquement s'il a réellement eu lieu (le même souci de reflow
          // superflu que ci-dessus s'applique à un scrollTo inconditionnel).
          // Ce correctif arrive TOUJOURS après coup (le scroll natif a déjà eu
          // lieu avant que ce listener ne s'exécute), ce qui se voit comme un
          // sursaut de la page puis un retour en place — cf. lockBodyScroll
          // ci-dessous, qui empêche ce scroll natif de se produire du tout.
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo(0, 0);
          }
        }

        // Empêche le scroll natif "amène le champ focalisé dans la vue"
        // évoqué ci-dessus, plutôt que de le corriger après coup : body passe
        // en position 'fixed' tant qu'un champ a le focus, dcp il n'y a plus
        // rien à faire défiler pour iOS. body a déjà overflow:hidden (cf.
        // #expo-reset plus haut) : aucun scroll normal n'y a jamais lieu, donc
        // rien à sauvegarder/restaurer ici, contrairement au correctif habituel
        // "scroll lock" qui doit mémoriser scrollY.
        function lockBodyScroll() {
          var style = document.body.style;
          style.position = 'fixed';
          style.top = '0';
          style.left = '0';
          style.right = '0';
        }
        function unlockBodyScroll() {
          var style = document.body.style;
          style.position = '';
          style.top = '';
          style.left = '';
          style.right = '';
        }
        document.addEventListener(
          'focusin',
          function (e) {
            var target = e.target;
            if (
              target &&
              (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)
            ) {
              lockBodyScroll();
            }
          },
          true
        );

        // le focus/blur d'un champ ne déclenche pas toujours un resize/scroll
        // fiable sur visualViewport (selon versions iOS) : on force nous-mêmes
        // une réévaluation juste après, avec un petit délai pour laisser le
        // clavier terminer son animation de fermeture avant de mesurer.
        document.addEventListener(
          'focusout',
          function () {
            unlockBodyScroll();
            setTimeout(setRealViewportHeight, 100);
          },
          true
        );

        function measureSafeAreaInsets() {
          var probe = document.createElement('div');
          var style = probe.style;
          style.position = 'fixed';
          style.left = '0';
          style.right = '0';
          style.top = '0';
          style.visibility = 'hidden';
          style.pointerEvents = 'none';
          style.paddingTop = 'env(safe-area-inset-top, 0px)';
          style.paddingBottom = 'env(safe-area-inset-bottom, 0px)';
          document.body.appendChild(probe);

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var computed = window.getComputedStyle(probe);
              var insets = {
                top: parseFloat(computed.paddingTop) || 0,
                bottom: parseFloat(computed.paddingBottom) || 0,
              };
              document.body.removeChild(probe);
              window.__webSafeAreaInsets = insets;
              window.dispatchEvent(new CustomEvent('webSafeAreaInsetsChange', { detail: insets }));
            });
          });
        }

        // l'encoche/île dynamique ne bouge jamais à cause du clavier (seule une
        // vraie rotation d'écran la déplace) : remesurer sur CHAQUE 'resize'
        // était non seulement inutile pendant l'animation d'ouverture du
        // clavier, mais carrément nocif — confirmé en conditions réelles, ça
        // provoquait un sursaut où le titre passait un instant sous la barre de
        // statut avant de se stabiliser. La sonde (double rAF, cf. plus haut)
        // tombait visiblement en plein milieu du reflow provoqué par le clavier
        // et remontait ponctuellement un insets.top erroné (trop petit), aussitôt
        // appliqué par useWebSafeAreaInsets. On ne remesure donc plus sur
        // 'resize' que si aucun clavier n'est ouvert à cet instant.
        function measureSafeAreaInsetsUnlessKeyboardOpen() {
          if (!isKeyboardLikelyOpen()) measureSafeAreaInsets();
        }

        setRealViewportHeight();
        // ce <script> s'exécute dans <head>, avant que <body> n'existe encore
        // dans le DOM (contrairement à documentElement, déjà présent) : la
        // toute première mesure doit attendre qu'il soit là.
        if (document.body) {
          measureSafeAreaInsets();
        } else {
          document.addEventListener('DOMContentLoaded', measureSafeAreaInsets, { once: true });
        }
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('resize', measureSafeAreaInsetsUnlessKeyboardOpen);
        window.addEventListener('orientationchange', setRealViewportHeight);
        window.addEventListener('orientationchange', measureSafeAreaInsets);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setRealViewportHeight);
          // 'resize' seul ne suffit pas : iOS peut aussi émettre 'scroll' sur
          // le visual viewport (sans changement de hauteur) pendant la
          // scroll-into-view automatique du champ focalisé
          window.visualViewport.addEventListener('scroll', setRealViewportHeight);
        }
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
