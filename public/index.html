<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : sans lui, iOS Safari garde la zone de l'encoche/
    barre d'état et de l'indicateur home comme marge inaccessible pour la page,
    et surtout react-native-safe-area-context (utilisé par l'app en natif)
    renvoie des insets à zéro faute de env(safe-area-inset-*) exploitable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9622E0" />
    <!-- Permet le vrai mode plein écran (sans barre d'adresse ni barre d'outils
    Safari) une fois la page ajoutée à l'écran d'accueil ("Partager" ->
    "Sur l'écran d'accueil") : en simple onglet Safari, ces barres restent
    toujours visibles, aucune page web ne peut les masquer. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guesstracks" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* couleur de fond neutre de l'app (cf. tailwind.config.js, "white" =
        #FAFAFA) : évite qu'un résidu de mise en page ne laisse voir le blanc
        par défaut du WKWebView */
        background-color: #FAFAFA;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      100%/100vh/100dvh sur html/body se sont tous révélés FAUX de quelques
      dizaines de pixels sur certains appareils en mode standalone iOS (bande
      blanche visible), et un correctif en pourcentage fixe (ex: 104%) qui
      corrigeait un iPhone Pro cassait complètement l'affichage sur iPhone
      mini (proportion différente vis-à-vis de son écran plus petit) — et
      créait à son tour des bandes en haut ET en bas hors du mode standalone.
      Plutôt que deviner un nombre par catégorie d'appareil, on mesure la
      VRAIE hauteur visible via window.visualViewport (le seul chiffre fiable
      quel que soit l'appareil, la taille d'écran, ou le mode d'affichage) et
      on l'applique nous-mêmes en pixels sur <html> : tout le reste
      (body, #root, puis toute la chaîne flex de l'app) en hérite via son
      simple height:100% ci-dessus, sans plus jamais avoir besoin d'un calcul
      approximatif nulle part.
    -->
    <script>
      (function () {
        function setRealViewportHeight() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.height = h + 'px';
        }
        setRealViewportHeight();
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('orientationchange', setRealViewportHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setRealViewportHeight);
        }
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
