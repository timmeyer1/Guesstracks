<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : sans lui, iOS Safari garde la zone de l'encoche/
    barre d'état et de l'indicateur home comme marge inaccessible pour la page,
    et surtout react-native-safe-area-context (utilisé par l'app en natif)
    renvoie des insets à zéro faute de env(safe-area-inset-*) exploitable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9622E0" />
    <!-- Permet le vrai mode plein écran (sans barre d'adresse ni barre d'outils
    Safari) une fois la page ajoutée à l'écran d'accueil ("Partager" ->
    "Sur l'écran d'accueil") : en simple onglet Safari, ces barres restent
    toujours visibles, aucune page web ne peut les masquer. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guesstracks" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Confirmé par test réel (inspecteur Safari branché sur iPhone) :
        c'est ICI, sur html/body — pas sur #root, un enfant qui hérite du
        problème sans le créer — que 100% est visiblement plus court que
        l'écran réel en mode standalone iOS (barre blanche en dessous de tout
        le contenu, y compris les formes décoratives). Forcer html/body à
        104% à la main (testé en live dans l'inspecteur) corrige totalement
        l'affichage. env(safe-area-inset-bottom) donne l'équivalent en pixels
        réels plutôt qu'un pourcentage qui ne serait juste que sur CET
        iPhone précis. */
        height: calc(100% + env(safe-area-inset-bottom, 0px));
        /* couleur de fond neutre de l'app (cf. tailwind.config.js, "white" =
        #FAFAFA) : évite qu'un résidu de calcul de hauteur ne laisse voir le
        blanc par défaut du WKWebView */
        background-color: #FAFAFA;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
